services:
  nginx:
    image: nginx:latest
    container_name: nginx-loadbalancer
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    networks:
     - backend

  server:
    build: .
    deploy:
      replicas: 2
    networks:
     - backend

networks:
   backend:
volumes:
  postgres_data:

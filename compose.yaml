services:
  nginx:
    image: nginx:latest
    container_name: nginx-loadbalancer

    ports:
      - "3000:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - server

    networks:
      - backend

  server:
    build: .

    depends_on:
      - postgres
    networks:
      - backend
    deploy:
      replicas: 10

  postgres:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:

services:
  server:
    build: .
    container_name: springboot-server
    ports:
      - "8080:8080"

    depends_on:
      - postgres
    networks:
      - backend

  postgres:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
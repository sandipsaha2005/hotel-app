services:

  nginx:
    image: nginx:latest
    container_name: nginx-loadbalancer
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - booking-service
    networks:
      - backend

  user-service:
    build:
      context: ./users
    container_name: user-service-container
    depends_on:
      - postgres
    networks:
      - backend

    environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: password
     POSTGRES_DB: hotel

  booking-service:
    build:
      context: ./bookings
    container_name: booking-service-container
    depends_on:
      - postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel

    networks:
      - backend

  search-service:
    build:
      context: ./search_service_js
    container_name: search-service-container
    depends_on:
      - postgres
      - redis
    networks:
      - backend

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel
      REDIS_HOST: redis
      REDIS_PORT: 6379

  postgres:
    image: postgres:16
    container_name: postgresdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel

    ports:
      - "5432:5432"

    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - backend

volumes:
    postgres_data:
networks:
   backend: